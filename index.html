<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BASO MIREA — Minecraft сервер</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#14161a; color:#e8e8e8; font-family:system-ui,sans-serif; text-align:center; }
    .card { max-width:480px; padding:32px; }
    h1 { margin:0 0 8px; }
    .ip { display:inline-block; margin:20px 0; padding:12px 20px; background:#23262d;
          border-radius:8px; font-family:monospace; font-size:1.2em; cursor:pointer; }
    a { color:#5ec27a; }
    ul { text-align:left; display:inline-block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BASO MIREA</h1>
    <p>Minecraft сервер</p>
    <div class="ip" id="ip" onclick="copyIp()">baso-mirea.ru</div>
    <p id="hint">Нажми на адрес, чтобы скопировать</p>
    <p>Версия: <b>1.21</b></p>
    <ul>
      <li>Не гриферить</li>
      <li>Не использовать читы</li>
    </ul>
    <p><a href="https://t.me/твой_канал">Наш Telegram</a></p>
  </div>
  <script>
    function copyIp() {
      navigator.clipboard.writeText("baso-mirea.ru");
      document.getElementById("hint").textContent = "Скопировано!";
    }
  </script>
</body>
</html>
